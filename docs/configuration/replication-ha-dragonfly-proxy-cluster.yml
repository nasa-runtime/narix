# replication-ha + Dragonfly + NARIX 三节点内置协调集群的单节点全量模板。
#
# 本文件表示 node_id=1。为 node 2/3 各复制一份，并分别修改：
# coordination.node_id、listen、advertise、data_dir、TLS 证书路径、admin.listen，
# 以及业务监听主机。业务端口、cluster_id、bootstrap_node_id、peers 和 HA group id
# 必须在三个节点间保持一致。
#
# 生产跨机器协调必须启用双向 TLS。下面的证书指纹是格式合法的占位值，
# 必须替换成每个成员叶子证书 DER 内容的真实 SHA-256 指纹。

# 本模式为每个前端绑定独立后端连接，以 max_connections 限制连接总量。
# 下列通用 pipeline 池与 DedicatedTunnel 池参数不参与本模式的数据转发。

reload: # 配置文件、证书依赖和显式请求的热更新策略。
  enabled: true # 是否允许文件检查、SIGHUP 和管理接口触发热更新。
  poll_interval_ms: 1000 # 检查配置来源和 TLS 依赖文件内容的周期，单位毫秒。
  stable_observations: 2 # 同一有效摘要连续出现多少次后自动发布，最小为 2。
  transaction_timeout_ms: 60000 # 单次加载、预检、协调和发布事务的总预算，单位毫秒。

admin: # 当前 NARIX 节点的管理端 HTTP 服务配置。
  enabled: true # 是否启动管理端；集群节点状态、控制接口和指标依赖该服务。
  listen: 127.0.0.1:18080 # 当前节点管理端监听地址；每个 NARIX 进程必须独立可抓取。
  token: "replace-with-a-long-random-admin-token" # 当前节点管理 API 认证令牌，部署前必须替换。
  allow_unauthenticated: false # 是否允许管理接口免认证；生产必须保持 false。

coordination: # NARIX 进程级内置协调控制面配置。
  enabled: true # 启动当前节点的协调 gRPC 服务和持久化共识协议。
  cluster_id: production-narix-dragonfly # 所有静态成员永久一致的协调集群标识。
  node_id: 1 # 当前成员稳定正整数编号；重启和重建配置时不得随意改变。
  listen: 0.0.0.0:19090 # 当前节点协调服务本地绑定地址。
  advertise: 203.0.113.11:19090 # 其他成员访问当前节点使用的可达地址；示例使用文档专用地址。
  data_dir: /var/lib/narix/coordination/node-1 # 当前节点独占的任期、日志、状态机和快照目录。
  grpc: # 协调传输预算；全部成员一致，启动后固定。
    message_size_ceiling_bytes: 268435456 # 部署允许的单消息上界，单位字节。
    unary_timeout_ceiling_ms: 86400000 # 部署允许的 unary 时长上界，单位毫秒。
    max_message_bytes: 201326592 # 实际编解码上限，不能超过部署上界。
    unary_timeout_ms: 86400000 # 服务端预算；更短的调用方期限优先。
    max_inflight_message_bytes: 805306368 # 所有在途消息共用的字节预算。
    managed_memory_budget_bytes: 2147483648 # 连接、stream、RPC 与消息的整体会计预算。
  bootstrap_node_id: 1 # 首次初始化成员关系的节点编号，所有成员必须相同。
  peers: # 完整静态成员表；运行时不能因为成员离线而删减。
    - node_id: 1 # 第一个协调成员的稳定编号。
      address: 203.0.113.11:19090 # 第一个成员对其他成员公布的协调地址。
      server_name: narix-1.internal # 校验第一个成员服务端证书使用的唯一名称。
      certificate_sha256: "1111111111111111111111111111111111111111111111111111111111111111" # 第一个成员叶子证书 DER 的 SHA-256 占位指纹，必须替换。
    - node_id: 2 # 第二个协调成员的稳定编号。
      address: 203.0.113.12:19090 # 第二个成员对其他成员公布的协调地址。
      server_name: narix-2.internal # 校验第二个成员服务端证书使用的唯一名称。
      certificate_sha256: "2222222222222222222222222222222222222222222222222222222222222222" # 第二个成员叶子证书 DER 的 SHA-256 占位指纹，必须替换。
    - node_id: 3 # 第三个协调成员的稳定编号。
      address: 203.0.113.13:19090 # 第三个成员对其他成员公布的协调地址。
      server_name: narix-3.internal # 校验第三个成员服务端证书使用的唯一名称。
      certificate_sha256: "3333333333333333333333333333333333333333333333333333333333333333" # 第三个成员叶子证书 DER 的 SHA-256 占位指纹，必须替换。
  heartbeat_interval_ms: 500 # 协调领导者发送心跳的周期，单位毫秒。
  election_timeout_min_ms: 1500 # 随机选举超时下界，必须大于两倍心跳周期。
  election_timeout_max_ms: 3000 # 随机选举超时上界，必须大于下界。
  rpc_timeout_ms: 1000 # 成员间单次 gRPC 请求的超时，单位毫秒。
  route_guard_timeout_ms: 5000 # 未确认领导权或对端联系后仍可沿用路由的保护窗口。
  action_timeout_ms: 30000 # fencing、提主、拓扑收敛和持久化动作令牌的有效期。
  snapshot_log_entries: 10000 # 已提交协调日志累计多少条后生成控制面快照。
  pair_election_retry_ms: 500 # 双节点协议竞选失败后的重试间隔；三节点配置中保留默认值。
  pair_allow_single_survivor: false # 是否允许双节点可靠隔离对端后单存活接管；三节点必须为 false。
  pair_peer_fencing_command: [] # 双节点单存活前隔离对端 NARIX 的命令；三节点必须为空。
  pair_peer_fencing_timeout_ms: 5000 # 双节点对端代理隔离动作的超时，单位毫秒。
  tls: # 协调端口双向 TLS 配置；跨机器生产部署必须开启。
    enabled: true # 同时启用服务端证书和客户端证书校验。
    certificate_path: /etc/narix/tls/narix-1.crt # 当前 node 1 的证书链 PEM 文件。
    private_key_path: /etc/narix/tls/narix-1.key # 当前 node 1 的私钥 PEM 文件。
    client_ca_path: /etc/narix/tls/coordination-ca.crt # 验证其他协调成员客户端证书的 CA PEM 文件。

proxies: # 当前进程承载的托管复制 HA 业务代理项列表。
  - name: replication-ha-dragonfly # 代理项唯一名称；所有 NARIX 成员必须保持一致。
    backend_profile: dragonfly # 选择 Dragonfly 的 replication-ha 适配器。
    mode: replication-ha # 托管复制主从探测、保护、自动切换和持久化编排的唯一入口。

    listen_host: 0.0.0.0 # 当前节点业务 listener 绑定主机。
    listen: 7001 # 当前节点业务端口；通常由外部四层 LB 汇聚多个 NARIX 成员。
    nodes: 198.51.100.11:6379@198.51.100.11:6379,198.51.100.12:6379@198.51.100.12:6379,198.51.100.13:6379@198.51.100.13:6379 # Dragonfly 节点清单，每项为 client_addr@replication_addr；使用文档专用地址。

    username: null # NARIX 访问全部 Dragonfly 节点使用的 ACL 用户名。
    password: null # NARIX 访问全部 Dragonfly 节点使用的后端密码。
    backend_tls_enabled: false # 是否对 Dragonfly 数据节点和探测连接启用受证书校验的 RESP TLS。
    backend_tls_ca_path: null # 验证 Dragonfly 节点证书链的 PEM CA 文件；启用 TLS 时必填。
    backend_tls_server_name: null # Dragonfly 节点证书 SNI；null 时从每个 client_addr 提取。
    backend_tls_certificate_path: null # 可选 mTLS 客户端证书 PEM 文件；必须与私钥同时配置。
    backend_tls_private_key_path: null # 可选 mTLS 客户端私钥 PEM 文件；必须与证书同时配置。
    frontend_password: "replace-with-a-long-random-client-password" # 业务客户端连接 NARIX 使用的前端密码。
    auth_mode: terminate # NARIX 终止前端认证，再使用独立后端凭据连接 Dragonfly。
    allow_unauthenticated: false # 是否允许客户端跳过代理侧认证；生产保持 false。
    read_only: false # 是否启用统一只读门禁。

    dedicated_tunnel_max_active: 1024 # Pub/Sub、阻塞、事务等专用后端连接的最大活跃数。
    dedicated_tunnel_queue_size: 1024 # 专用连接达到上限后的等待队列容量。
    dedicated_tunnel_acquire_timeout_ms: 1000 # 获取专用连接许可的最长等待时间，单位毫秒。
    dedicated_tunnel_pool_max_idle: 1000 # 每个 Dragonfly 节点最多保留的 clean idle tunnel 数。
    dedicated_tunnel_pool_idle_timeout_ms: 30000 # clean tunnel 最大空闲时间，单位毫秒。

    connect_timeout_ms: 3000 # 普通后端 TCP 建连超时，单位毫秒。
    backend_request_timeout_ms: 10000 # 普通后端请求响应超时，单位毫秒。
    frontend_auth_timeout_ms: 10000 # 前端完成 AUTH/HELLO 初始化的超时，单位毫秒。
    client_idle_timeout_ms: 0 # 已认证客户端空闲关闭时间；0 表示不主动关闭。
    tcp_keepalive_ms: 0 # TCP keepalive 周期；0 使用系统默认行为。
    max_connections: 65535 # 当前代理项允许的最大前端连接数。
    max_auth_bytes: 16384 # 认证阶段允许累计读取的最大字节数。

    pipeline_max_commands: 1000 # 单批 pipeline 最大命令数量。
    pipeline_max_bytes: 4194304 # 单批 pipeline 最大输入字节数。
    pipeline_backend_max_active: 5000 # pipeline 后端连接池最大活跃连接数。
    pipeline_backend_queue_size: 4096 # pipeline 池耗尽后的等待队列容量。
    pipeline_backend_submit_timeout_ms: 1000 # 等待向 pipeline 池提交任务的超时，单位毫秒。
    pipeline_backend_idle_timeout_ms: 60000 # pipeline 后端连接最大空闲时间，单位毫秒。

    frame_max_bytes: 4194304 # 单个 RESP frame 最大字节数。
    bulk_max_bytes: 4194304 # 单个 RESP bulk string 最大字节数。
    aggregate_max_concurrency: 32 # 聚合类请求最大并发子任务数。
    aggregate_max_items: 10000 # 聚合类命令最大元素数。
    pending_response_bytes: 16777216 # 单前端连接尚未写回的响应字节上限。
    graceful_shutdown_timeout_ms: 10000 # 收到退出信号后等待连接和任务收敛的时间，单位毫秒。
    cluster_topology_refresh_ms: 60000 # 通用 Cluster 拓扑刷新默认值；replication-ha 不使用槽位拓扑。

    ha: # 后端无关的托管复制 HA 控制面配置。
      probe_interval_ms: 2000 # 全部节点角色和复制健康探测周期，单位毫秒。
      probe_connect_timeout_ms: 300 # Dragonfly 角色探测建连超时；省略时继承 connect_timeout_ms。
      probe_request_timeout_ms: 1000 # Dragonfly 角色探测响应超时；省略时继承 backend_request_timeout_ms。
      master_down_after_failures: 3 # 主节点连续探测失败多少轮后形成故障判断。
      auto_failover: true # 确认主故障后先关闭路由，协调权威和观察票数满足时再提升候选。
      observer: false # 观察者不可加入协调集群；旁路观察节点应独立部署，业务只读还需 read_only: true。
      max_replica_lag: 0 # 候选副本最大复制延迟秒数；0 不设数值上限。

      fencing: # 旧主基础设施隔离配置。
        mode: external-command # 通过外部基础设施程序可靠隔离旧主。
        command: # 外部 fencing 程序及独立参数；NARIX 不经 shell 拼接。
          - /usr/local/bin/fence-dragonfly # 负责隔离旧主的可执行程序绝对路径。
          - --proxy # 传递代理名称参数的固定选项。
          - "{proxy}" # 当前代理项名称占位符。
          - --client-addr # 传递旧主业务地址的固定选项。
          - "{client_addr}" # 待隔离旧主的业务地址占位符。
          - --replication-addr # 传递旧主复制地址的固定选项。
          - "{replication_addr}" # 待隔离旧主的复制地址占位符。
          - --action-token # 传递当前协调动作令牌的固定选项。
          - "{action_token}" # 用于拒绝过期外部动作的令牌占位符。
        timeout_ms: 10000 # 外部隔离程序最大执行时间，单位毫秒。

      coordinator: # 多 NARIX 动作批准配置。
        mode: proxy-cluster # 使用 NARIX 内置协调集群串行化故障转移。
        owner_id: null # local-file/redis 模式下当前实例身份；本模式必须为空。
        lease_path: null # local-file 租约路径；本模式必须为空。
        group_id: production-dragonfly # 同一后端拓扑在所有 NARIX 成员上的稳定组名。
        observation_quorum: 0 # 故障观察票数；0 表示静态成员多数派，本例为 2。
        observation_window_ms: 3000 # 相同故障指纹共同计票的时间窗口，单位毫秒。
        redis_addr: null # redis 协调器地址；本模式必须为空。
        redis_username: null # redis 协调器 ACL 用户名；本模式必须为空。
        redis_password: null # redis 协调器密码；本模式必须为空。
        redis_key: null # redis 协调器租约键；本模式必须为空。
        redis_connect_timeout_ms: 3000 # redis 模式建连超时；本模式保留默认值。
        redis_request_timeout_ms: 3000 # redis 模式请求超时；本模式保留默认值。
        lease_ttl_ms: 15000 # local-file/redis 租约 TTL；本模式保留默认值。
        lease_renew_interval_ms: 5000 # local-file/redis 续租周期；必须小于 TTL。
        lease_acquire_timeout_ms: 3000 # local-file/redis 竞争租约超时；本模式保留默认值。

      persistence: # Dragonfly 动态快照责任配置。
        enabled: true # 多节点拓扑只让合格副本承担动态持久化责任，并在切主后重新分配。
        fail_closed: true # 无法证明持久化责任安全时关闭业务路由。
        force_checkpoint_on_handoff: true # owner 交接时要求新 owner 立即生成一次产品原生持久化点。
        min_replica_stable_ms: 5000 # 副本承担责任前必须连续稳定的时间，单位毫秒。
        require_zero_lag: true # 只允许归一化复制延迟为零的副本承担持久化责任。
        dragonfly: # Dragonfly 原生动态快照参数。
          snapshot_cron: "*/5 * * * *" # 持久化 owner 使用的周期快照计划。
          dbfilename: "dump-{role}-{client_addr_safe}-{timestamp}" # 快照文件名模板。
          dir: /var/lib/dragonfly # Dragonfly 快照目录；必须由节点启动参数预先配置并与挂载一致，NARIX 只校验。
          verify_timeout_ms: 30000 # 强制快照完成校验超时，单位毫秒。
