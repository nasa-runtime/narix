# replication-ha + Dragonfly 单 NARIX 节点、软隔离自动切换的全量示例。
# 该文件显式展开所有通用字段和 Dragonfly 产品字段；互斥协调器字段使用 null。
# 生产应配置真实 external-command fencing；多机多 NARIX 使用 proxy-cluster 或独立 Redis 协调器。

reload: # 配置文件、证书依赖和显式请求的热更新策略。
  enabled: true # 是否允许文件检查、SIGHUP 和管理接口触发热更新。
  poll_interval_ms: 1000 # 检查配置来源和 TLS 依赖文件内容的周期，单位毫秒。
  stable_observations: 2 # 同一有效摘要连续出现多少次后自动发布，最小为 2。
  transaction_timeout_ms: 60000 # 单次加载、预检、协调和发布事务的总预算，单位毫秒。

admin: # 管理端 HTTP 服务配置。
  enabled: true # 是否启动管理端；Dragonfly 状态、控制接口和指标依赖该服务。
  listen: 127.0.0.1:18080 # 管理端监听地址；生产建议绑定回环或受信管理网卡。
  token: "replace-with-a-long-random-admin-token" # 管理 API 认证令牌，部署前必须替换。
  allow_unauthenticated: false # 是否允许管理接口免认证；生产必须保持 false。

coordination: # NARIX 进程级内置协调控制面；本单节点示例保持关闭。
  enabled: false # false 不启动协调 gRPC listener，并要求 peers 为空。
  cluster_id: "" # 协调集群唯一标识；关闭时使用空字符串占位。
  node_id: 0 # 当前协调成员稳定编号；0 只允许用于关闭状态。
  listen: 127.0.0.1:19090 # 协调服务本地监听地址；关闭时不会实际绑定。
  advertise: 127.0.0.1:19090 # 其他协调成员访问当前节点的地址；关闭时仅作默认占位。
  data_dir: "" # 任期、日志和快照目录；关闭时使用空字符串。
  bootstrap_node_id: 0 # 首次建群成员编号；关闭时使用 0。
  peers: [] # 完整静态成员表；关闭时必须为空。
  heartbeat_interval_ms: 500 # 协调领导心跳周期，单位毫秒。
  election_timeout_min_ms: 1500 # 随机选举超时下界，必须大于两倍心跳周期。
  election_timeout_max_ms: 3000 # 随机选举超时上界，必须大于下界。
  rpc_timeout_ms: 1000 # 成员间单次 gRPC 请求超时，单位毫秒。
  route_guard_timeout_ms: 5000 # 未确认权威后仍允许沿用路由的保护窗口，单位毫秒。
  action_timeout_ms: 30000 # fencing、提主和持久化动作令牌的有效期，单位毫秒。
  snapshot_log_entries: 10000 # 多数派日志累计多少条已提交记录后生成控制面快照。
  pair_election_retry_ms: 500 # 双节点竞选失败后的重试间隔，单位毫秒。
  pair_allow_single_survivor: false # 是否允许可靠隔离对端代理后单节点接管。
  pair_peer_fencing_command: [] # 双节点单存活接管前隔离对端 NARIX 的外部命令。
  pair_peer_fencing_timeout_ms: 5000 # 对端代理隔离命令的执行超时，单位毫秒。
  tls: # 协调端口双向 TLS 配置。
    enabled: false # 是否启用协调端口双向 TLS；关闭时协调地址只能使用回环 IP。
    certificate_path: null # 当前成员证书链 PEM 路径；TLS 关闭时必须为 null。
    private_key_path: null # 当前成员私钥 PEM 路径；TLS 关闭时必须为 null。
    client_ca_path: null # 验证其他成员客户端证书的 CA PEM 路径；TLS 关闭时必须为 null。

proxies: # 托管复制 HA 业务代理项列表。
  - name: replication-ha-dragonfly # 代理项唯一名称，也是日志、指标和协调状态中的稳定身份。
    backend_profile: dragonfly # 选择 Dragonfly 的 replication-ha 适配器。
    mode: replication-ha # 托管复制主从探测、保护和受控切换的唯一模式入口。

    listen_host: 0.0.0.0 # 业务 listener 绑定主机；0.0.0.0 表示全部 IPv4 网卡。
    listen: 7001 # 业务客户端连接该托管复制代理的端口。
    nodes: 198.51.100.11:6379@198.51.100.11:6379,198.51.100.12:6379@198.51.100.12:6379 # 逗号分隔节点，每项为 client_addr@replication_addr；使用文档专用地址。

    username: null # NARIX 访问 Dragonfly 节点使用的 ACL 用户名。
    password: null # NARIX 访问 Dragonfly 节点使用的后端密码。
    backend_tls_enabled: false # 是否对 Dragonfly 数据节点和探测连接启用受证书校验的 RESP TLS。
    backend_tls_ca_path: null # 验证 Dragonfly 节点证书链的 PEM CA 文件；启用 TLS 时必填。
    backend_tls_server_name: null # Dragonfly 节点证书 SNI；null 时从每个 client_addr 提取。
    backend_tls_certificate_path: null # 可选 mTLS 客户端证书 PEM 文件；必须与私钥同时配置。
    backend_tls_private_key_path: null # 可选 mTLS 客户端私钥 PEM 文件；必须与证书同时配置。
    frontend_password: "replace-with-a-long-random-client-password" # 业务客户端连接 NARIX 使用的前端密码。
    auth_mode: terminate # NARIX 终止前端认证，再使用独立凭据连接 Dragonfly。
    allow_unauthenticated: false # 是否允许客户端跳过代理侧认证；生产保持 false。
    read_only: false # 是否启用统一只读门禁。

    dedicated_tunnel_max_active: 1024 # Pub/Sub、阻塞、事务等专用后端连接的最大活跃数。
    dedicated_tunnel_queue_size: 1024 # 专用连接达到上限后的等待队列容量。
    dedicated_tunnel_acquire_timeout_ms: 1000 # 获取专用连接许可的最长等待时间，单位毫秒。
    dedicated_tunnel_pool_max_idle: 1000 # 每个 Dragonfly 节点最多保留的 clean idle tunnel 数。
    dedicated_tunnel_pool_idle_timeout_ms: 30000 # clean tunnel 最大空闲时间，单位毫秒。

    connect_timeout_ms: 3000 # 普通后端 TCP 建连超时，单位毫秒。
    backend_request_timeout_ms: 10000 # 普通后端请求响应超时，单位毫秒。
    frontend_auth_timeout_ms: 10000 # 前端完成 AUTH/HELLO 初始化的超时，单位毫秒。
    client_idle_timeout_ms: 0 # 已认证客户端空闲关闭时间；0 表示不主动关闭。
    tcp_keepalive_ms: 0 # TCP keepalive 周期；0 使用系统默认行为。
    max_connections: 65535 # 当前代理项允许的最大前端连接数。
    max_auth_bytes: 16384 # 认证阶段允许累计读取的最大字节数。

    pipeline_max_commands: 1000 # 单批 pipeline 最大命令数量。
    pipeline_max_bytes: 4194304 # 单批 pipeline 最大输入字节数。
    pipeline_backend_max_active: 5000 # pipeline 后端连接池最大活跃连接数。
    pipeline_backend_queue_size: 4096 # pipeline 池耗尽后的等待队列容量。
    pipeline_backend_submit_timeout_ms: 1000 # 等待向 pipeline 池提交任务的超时，单位毫秒。
    pipeline_backend_idle_timeout_ms: 60000 # pipeline 后端连接最大空闲时间，单位毫秒。

    frame_max_bytes: 4194304 # 单个 RESP frame 最大字节数。
    bulk_max_bytes: 4194304 # 单个 RESP bulk string 最大字节数。
    aggregate_max_concurrency: 32 # 聚合类请求最大并发子任务数。
    aggregate_max_items: 10000 # 聚合类命令最大元素数。
    pending_response_bytes: 16777216 # 单前端连接尚未写回的响应字节上限。
    graceful_shutdown_timeout_ms: 10000 # 收到退出信号后等待连接和任务收敛的时间，单位毫秒。
    cluster_topology_refresh_ms: 60000 # 通用 Cluster 拓扑刷新默认值；replication-ha 不使用槽位拓扑。

    ha: # 后端无关的托管复制 HA 控制面配置。
      probe_interval_ms: 2000 # 全部节点角色和复制健康探测周期，单位毫秒。
      probe_connect_timeout_ms: 300 # Dragonfly 角色探测建连超时；省略时继承 connect_timeout_ms。
      probe_request_timeout_ms: 1000 # Dragonfly 角色探测响应超时；省略时继承 backend_request_timeout_ms。
      master_down_after_failures: 3 # 主节点连续探测失败多少轮后形成故障判断。
      auto_failover: true # 确认主故障后先关闭路由，再经过 fencing 和候选门禁自动恢复；人工接管改为 false。
      observer: false # true 时控制面零写入，主故障、未确认新主或双主保持保护；业务只读还需 read_only: true。
      max_replica_lag: 0 # 候选副本最大复制延迟秒数；0 不设数值上限。

      fencing: # 旧主隔离策略。
        mode: manual # 默认软隔离，无脚本但存在短暂双写风险；生产强隔离改 external-command 并演练隔离程序。
        command: [] # 仅 external-command 模式使用；首项是可执行文件，其余按原样作为参数传入，不经 shell。示例：["/opt/narix/bin/fence", "{client_addr}"]。
        timeout_ms: 10000 # 外部隔离程序最大执行时间，单位毫秒。

      coordinator: # HA 动作租约和多 NARIX 协调配置。
        mode: local-file # 本机单实例用文件租约串行化自动/人工切换与持久化交接；跨机器多实例改用 proxy-cluster 或 redis。
        owner_id: replication-ha-dragonfly-node-1 # 当前 NARIX 实例参与 HA 动作时使用的稳定身份。
        lease_path: /var/run/narix/replication-ha-dragonfly.lease # local-file 租约文件路径。
        group_id: null # proxy-cluster 模式下同一后端拓扑的稳定组名。
        observation_quorum: 0 # proxy-cluster 故障观察票数；0 表示静态成员多数派。
        observation_window_ms: 3000 # 相同故障指纹参与计票的时间窗口，单位毫秒。
        redis_addr: null # redis 模式使用的独立协调 Redis 地址，不能指向被管理节点。
        redis_username: null # 独立协调 Redis 的可选 ACL 用户名。
        redis_password: null # 独立协调 Redis 的可选认证密码。
        redis_key: null # redis 模式下同一 HA 组共享的租约键。
        redis_connect_timeout_ms: 3000 # 独立协调 Redis 建连超时，单位毫秒。
        redis_request_timeout_ms: 3000 # 独立协调 Redis 命令响应超时，单位毫秒。
        lease_ttl_ms: 15000 # local-file/redis 租约有效期，单位毫秒。
        lease_renew_interval_ms: 5000 # 租约续约周期，必须小于 TTL。
        lease_acquire_timeout_ms: 3000 # 单轮竞争租约允许等待的最长时间，单位毫秒。

      persistence: # 产品动态持久化配置。
        enabled: false # 本示例不分配从节点快照责任。
        fail_closed: true # 持久化责任无法安全收敛时是否关闭业务路由。
        force_checkpoint_on_handoff: true # owner 交接时是否立即生成一次产品原生持久化点。
        min_replica_stable_ms: 5000 # 副本承担责任前必须连续稳定的时间，单位毫秒。
        require_zero_lag: true # 是否只允许归一化复制延迟为零的副本承担持久化责任。
        dragonfly: # Dragonfly 原生动态快照参数。
          snapshot_cron: "*/5 * * * *" # 持久化 owner 使用的周期快照计划。
          dbfilename: "dump-{role}-{client_addr_safe}-{timestamp}" # 快照文件名模板。
          dir: null # 可选快照目录；1.39.0 不支持动态修改，非空时只校验节点启动值。
          verify_timeout_ms: 30000 # 强制快照完成校验超时，单位毫秒。
