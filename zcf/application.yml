# NARIX 内置最小安全配置。
# 业务代理项必须通过 --config、APP_CONFIG_FILE、NARIX_CONFIG、profile 文件或 NARIX_ 环境变量提供。
# 所有字段、默认值、约束和各模式全量示例见 docs/configuration.md。

application:
  # 应用名称用于默认日志目录，进程按服务模式运行。
  name: narix

log:
  # 整段支持热更新：文件稳定变化、SIGHUP 或管理接口触发；候选无效时保留当前输出。
  # 默认保留 WARN、ERROR 及 narix 的关键 INFO；RUST_LOG 显式设置时优先。
  # 需要通过 YAML 热更级别时，不要设置 RUST_LOG 或 NARIX_LOG_LEVEL 覆盖它。
  level: ${NARIX_LOG_LEVEL:warn,narix=info}
  # 目录必须可写；NARIX_LOG_PATH 显式为空时只输出控制台。
  path: ${NARIX_LOG_PATH:/usr/local/logs/${application.name}}
  # 单文件大小、归档总容量及保留天数；同名环境变量覆盖期间，修改 YAML 不改变有效值。
  max_file_size: 100MB
  total_size_cap: 1GB
  max_history_days: 7
  clean_history_on_start: true
  split_error_file: true
  color: false

admin: # 管理端 HTTP 服务配置。
  enabled: true # 启用健康、就绪、状态、指标和配置热更新接口。
  listen: 127.0.0.1:18080 # 仅绑定本机管理端口，避免默认暴露到外部网络。
  token: "change-me-admin-token" # 启动前必须由外部配置或 NARIX_ADMIN_TOKEN 替换。
  allow_unauthenticated: false # 管理接口保持认证；生产环境不能开启免认证。

reload: # 配置热更新的最小运维配置。
  enabled: true # 启用文件检查、SIGHUP 和管理接口热更新。
  poll_interval_ms: 1000 # 配置文件及 TLS 依赖内容的检查周期，单位毫秒，默认 1 秒。

coordination: # 集群配置恢复需要保留的本机 TLS 引导字段。
  tls: # 默认关闭协调通道 TLS，跨机器协调时由节点外部配置完整覆盖。
    enabled: false # 不启用协调通道双向 TLS。
    certificate_path: null # 当前节点证书链；启用 TLS 时必须配置。
    private_key_path: null # 当前节点私钥；启用 TLS 时必须配置。
    client_ca_path: null # 校验其他协调成员客户端证书的 CA；启用 TLS 时必须配置。

proxies: [] # 内置配置不预置业务监听器，由部署配置提供完整代理项集合。
