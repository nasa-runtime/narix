name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      release_ci_run_id:
        description: Successful CI run for the published GitHub release commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: dockerhub-narix
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.source.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_CI_RUN_ID: ${{ inputs.release_ci_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify published GitHub source and CI
        id: source
        run: |
          python3 - <<'PYVERIFY'
          import json, os, re, subprocess, tomllib
          from pathlib import Path
          repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
          run_id = os.environ['RELEASE_CI_RUN_ID']
          assert re.fullmatch(r'[0-9]+', run_id), 'Invalid CI run ID'
          assert repo == 'nasa-runtime/narix', 'Unexpected repository'
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version), 'Stable version required'
          run = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}']))
          assert run['head_sha'] == sha and run['head_branch'] == 'release', 'CI source differs'
          assert run['path'] == '.github/workflows/ci.yml' and run['event'] == 'push', 'Unexpected CI workflow'
          assert run['status'] == 'completed' and run['conclusion'] == 'success', 'Successful release CI required'
          release = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/tags/{version}']))
          assert not release['draft'] and not release['prerelease'] and release['published_at'], 'Publish GitHub release first'
          subprocess.run(['git','fetch','origin',f'refs/tags/{version}'],check=True)
          assert subprocess.check_output(['git','rev-parse','FETCH_HEAD^{}'],text=True).strip() == sha, 'Release tag differs'
          for branch in ['master','release']:
              ref = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/git/ref/heads/{branch}']))
              assert ref['object']['sha'] == sha, 'Branch source differs'
          for file in ['docker/README.md','docker/README.en.md']:
              text = Path(file).read_text()
              assert 0 < len(text.encode()) <= 25000 and text.count('docker run -d') >= 14, 'Complete overview required'
              assert all(value in text for value in ['Sentinel','Cluster','Dragonfly','/etc/localtime','/var/lib/narix','/usr/local/logs/narix']), 'Overview misses deployment scenarios'
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write(f'version={version}\n')
          PYVERIFY

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build native image archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: narix:build-${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            APP_VERSION=${{ env.VERSION }}
            SOURCE_REVISION=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/narix-${{ matrix.arch }}.tar
          cache-from: type=gha,scope=narix-${{ matrix.arch }}
          cache-to: type=gha,scope=narix-${{ matrix.arch }},mode=max
          provenance: false
      - name: Validate native startup, mounts and identity
        shell: bash
        run: |
          set -euo pipefail
          image="narix:build-${GITHUB_SHA}-${ARCH}"
          docker load --input "${RUNNER_TEMP}/narix-${ARCH}.tar"
          test "$(docker run --rm "$image" --version)" = "narix ${VERSION}"
          root="${RUNNER_TEMP}/narix-deployment"
          mkdir -p "$root/config" "$root/data" "$root/logs"
          printf 'application:\n  name: narix\nadmin:\n  listen: 0.0.0.0:18080\n  token: container-startup-token\nproxies: []\n' > "$root/config/narix.yml"
          sudo chown 10001:10001 "$root/data" "$root/logs"
          docker run -d --name narix-startup --stop-timeout 70 \
            -p 127.0.0.1:18080:18080 \
            -v "$root/config:/etc/narix:ro" -v "$root/data:/var/lib/narix" \
            -v "$root/logs:/usr/local/logs/narix" -v /etc/localtime:/etc/localtime:ro \
            "$image"
          trap 'docker logs narix-startup; docker rm -f narix-startup' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18080/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/health
          docker stop --time 70 narix-startup
          test "$(docker inspect --format '{{.State.ExitCode}}' narix-startup)" = 0
          python3 - <<'PYIDENTITY'
          import hashlib, json, os, subprocess, tarfile
          from pathlib import Path
          arch, sha = os.environ['ARCH'], os.environ['GITHUB_SHA']
          tag = f'narix:build-{sha}-{arch}'
          image = json.loads(subprocess.check_output(['docker','image','inspect',tag]))[0]
          assert image['Architecture'] == arch and image['Config']['User'] == '10001:10001', 'Runtime identity differs'
          assert image['Config']['Labels']['org.opencontainers.image.revision'] == sha, 'Source differs'
          assert image['Config']['Labels']['org.opencontainers.image.version'] == os.environ['VERSION'], 'Version differs'
          with tarfile.open(Path(os.environ['RUNNER_TEMP']) / f'narix-{arch}.tar') as archive:
              entries = json.load(archive.extractfile('manifest.json'))
              assert len(entries) == 1 and entries[0]['RepoTags'] == [tag], 'Archive differs'
              raw = archive.extractfile(entries[0]['Config']).read()
          value = {'source':sha,'version':os.environ['VERSION'],'config_digest':'sha256:'+hashlib.sha256(raw).hexdigest()}
          (Path(os.environ['RUNNER_TEMP']) / f'narix-{arch}.identity.json').write_text(json.dumps(value))
          PYIDENTITY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/narix-${{ matrix.arch }}.tar
            ${{ runner.temp }}/narix-${{ matrix.arch }}.identity.json
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: [verify, build]
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      HUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify source and completed build
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, tomllib
          from pathlib import Path
          repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
          for branch in ['master', 'release']:
              ref = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/git/ref/heads/{branch}']))
              assert ref['object']['sha'] == sha, f'{branch} has a different revision'
          with open('Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['package']['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version), 'Stable version required'
          namespace = os.environ['HUB_NAMESPACE']
          assert re.fullmatch(r'[a-z0-9][a-z0-9_-]*', namespace), 'Invalid Docker Hub namespace'
          assert namespace == 'nasaruntime', 'Docker Hub documentation and namespace must agree'
          assert Path('docker/README.md').is_file(), 'Docker Hub overview is required'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'IMAGE={namespace}/narix\nVERSION={version}\n')
          PY
      - name: Download image archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          pattern: image-*
          merge-multiple: true
          path: image-archives
      - name: Verify exact image identities
        run: |
          python3 - <<'PYIDENTITY'
          import hashlib, json, os, subprocess, tarfile
          for arch in ['amd64', 'arm64']:
              identity = json.load(open(f'image-archives/narix-{arch}.identity.json'))
              assert identity['source'] == os.environ['GITHUB_SHA'] and identity['version'] == os.environ['VERSION'], 'Archive identity differs'
              expected_digest = identity['config_digest']
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write(f'{arch.upper()}_CONFIG_DIGEST={expected_digest}\n')
              archive = f'image-archives/narix-{arch}.tar'
              tag = f'narix:build-{os.environ["GITHUB_SHA"]}-{arch}'
              # 配置摘要绑定运行参数与全部文件系统层，不依赖 Docker 存储后端的 ID 表示。
              with tarfile.open(archive) as source:
                  entries = json.load(source.extractfile('manifest.json'))
                  assert len(entries) == 1 and entries[0]['RepoTags'] == [tag], 'Unexpected archive tags'
                  raw = source.extractfile(entries[0]['Config']).read()
                  assert 'sha256:' + hashlib.sha256(raw).hexdigest() == expected_digest, 'Archive differs from validated artifact'
                  config = json.loads(raw)
              subprocess.run(['docker', 'load', '--input', archive], check=True)
              image = json.loads(subprocess.check_output(['docker', 'image', 'inspect', tag]))[0]
              assert image['RootFS']['Type'] == config['rootfs']['type'] and image['RootFS']['Layers'] == config['rootfs']['diff_ids'], 'Loaded image layers differ'
              for field in ['User', 'Env', 'Entrypoint', 'Cmd', 'WorkingDir', 'Labels', 'StopSignal', 'ExposedPorts']:
                  assert image['Config'].get(field) == config['config'].get(field), f'Loaded image {field} differs'
              assert image['Architecture'] == arch and image['Os'] == 'linux', 'Unexpected image platform'
              assert config['architecture'] == arch and config['os'] == 'linux', 'Unexpected archive platform'
              assert image['Config']['User'] == '10001:10001', 'Unexpected runtime identity'
              assert image['Config']['Entrypoint'] == ['/app/narix'], 'Unexpected entrypoint'
              labels = image['Config']['Labels']
              assert labels['org.opencontainers.image.revision'] == os.environ['GITHUB_SHA'], 'Unexpected source'
              assert labels['org.opencontainers.image.version'] == os.environ['VERSION'], 'Unexpected version'
          PYIDENTITY
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Sign in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify registry version ownership
        run: |
          python3 - <<'PYREGISTRY'
          import json, os, urllib.error, urllib.parse, urllib.request
          image = os.environ['IMAGE']
          query = urllib.parse.urlencode({'service': 'registry.docker.io', 'scope': f'repository:{image}:pull'})
          with urllib.request.urlopen(f'https://auth.docker.io/token?{query}', timeout=30) as response:
              token = json.load(response)['token']
          def manifest(reference):
              """业务作用：读取远端镜像身份，区分不存在与无法确认。
              参数说明：
              - reference：待核对的标签或内容摘要。
              返回：存在时返回清单，仅 HTTP 404 返回 None，其余失败停止发布。
              """
              request = urllib.request.Request(
                  f'https://registry-1.docker.io/v2/{image}/manifests/{reference}',
                  headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return None
                  raise SystemExit(f'Registry preflight failed: HTTP {error.code}')
          expected = {arch: os.environ[f'{arch.upper()}_CONFIG_DIGEST'] for arch in ['amd64', 'arm64']}
          version = manifest(os.environ['VERSION'])
          if version is not None:
              # 已存在的内容只能用于继续完成同一发布，不能替换已公开版本。
              entries = version.get('manifests', [])
              assert sorted((entry['platform']['os'], entry['platform']['architecture']) for entry in entries) == [('linux', 'amd64'), ('linux', 'arm64')], 'Existing version platforms differ'
              for entry in entries:
                  arch = entry['platform']['architecture']
                  assert manifest(entry['digest'])['config']['digest'] == expected[arch], 'Existing version content differs; choose a new version'
          for arch in expected:
              existing = manifest(f'sha-{os.environ["GITHUB_SHA"]}-{arch}')
              assert existing is None or existing['config']['digest'] == expected[arch], 'Existing architecture image differs'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'PUBLISH_VERSION={"true" if version is None else "false"}\n')
          PYREGISTRY
      - name: Upload exact images and version manifest
        if: env.PUBLISH_VERSION == 'true'
        run: |
          for arch in amd64 arm64; do
            source="narix:build-${GITHUB_SHA}-${arch}"
            target="${IMAGE}:sha-${GITHUB_SHA}-${arch}"
            docker tag "$source" "$target"
            docker push "$target"
          done
          docker buildx imagetools create --tag "${IMAGE}:${VERSION}" \
            "${IMAGE}:sha-${GITHUB_SHA}-amd64" "${IMAGE}:sha-${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect --raw "${IMAGE}:${VERSION}" > version-manifest.json
          python3 - <<'PY'
          import json
          with open('version-manifest.json') as source:
              manifests = json.load(source)['manifests']
          assert sorted((item['platform']['os'], item['platform']['architecture']) for item in manifests) == [('linux', 'amd64'), ('linux', 'arm64')]
          PY
      - name: Publish repository overview
        env:
          HUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          credentials = {'identifier': os.environ['HUB_USERNAME'], 'secret': os.environ['HUB_TOKEN']}
          request = urllib.request.Request('https://hub.docker.com/v2/auth/token', data=json.dumps(credentials).encode(), headers={'Content-Type': 'application/json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)['access_token']
          print(f'::add-mask::{token}')
          overview = Path('docker/README.md').read_text()
          description = 'High-performance RESP2/RESP3 proxy featuring Dragonfly HA'
          url = f'https://hub.docker.com/v2/repositories/{os.environ["IMAGE"]}/'
          request = urllib.request.Request(url, data=json.dumps({'description': description, 'full_description': overview}).encode(), headers={'Content-Type': 'application/json', 'Authorization': f'Bearer {token}'}, method='PATCH')
          with urllib.request.urlopen(request, timeout=30):
              pass
          request = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}'})
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          assert result['full_description'] == overview, 'Docker Hub overview differs'
          assert result['description'] == description, 'Docker Hub summary differs'
          PY
      - name: Update latest to the published version
        run: |
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${VERSION}"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          docker buildx imagetools inspect "${IMAGE}:latest"
          printf 'Image: %s:%s\nSource: %s\n' "$IMAGE" "$VERSION" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
