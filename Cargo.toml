[package]
name = "narix"
version = "1.0.1"
edition = "2021"
rust-version = "1.94"
publish = false
license = "Apache-2.0"
description = "NARIX（NASA Adaptive RESP2/3 Infrastructure eXchange）：高性能 RESP2/3 前置代理、托管复制 HA 控制面与只读查询入口。"
readme = "README.md"
repository = "https://github.com/nasa-runtime/narix"
homepage = "https://github.com/nasa-runtime/narix"
keywords = ["dragonfly", "redis", "resp", "proxy", "high-availability"]
categories = ["database", "network-programming"]
include = [
    "/.github/**",
    "/.gitignore",
    "/.dockerignore",
    "/CHANGELOG.md",
    "/CHANGELOG.en.md",
    "/CONTRIBUTING.md",
    "/CONTRIBUTING.en.md",
    "/Cargo.lock",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.en.md",
    "/SECURITY.md",
    "/SECURITY.en.md",
    "/build.rs",
    "/command-matrix.md",
    "/command-matrix.en.md",
    "/dashboards/**",
    "/docs/**",
    "/docker/**",
    "/proto/**",
    "/src/**",
    "/zcf/**",
]

# 跨 crate 优化与集中生成减少重复机器码，同时保留默认的 panic 展开和运行时能力。
[profile.release]
lto = "thin"
codegen-units = 1

[dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
libc = "0.2"
nasa = { version = "=2.0.7", default-features = false, features = ["application", "log", "yml", "grpc", "secret", "base"] }
nametrics-core = "=2.0.1"
openraft = { version = "0.9.24", features = ["serde", "storage-v2"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"

[build-dependencies]
nagrpc-build = "=2.0.1"
