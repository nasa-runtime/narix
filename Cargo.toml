[package]
name = "narix"
version = "1.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "NARIX（NASA Adaptive RESP2/3 Infrastructure eXchange）：高性能 RESP2/3 多 KV 代理与拓扑接入层。"
exclude = [
    "tests/**",
    "scripts/**",
    "target/**",
]

[dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
libc = "0.2"
config = { version = "0.15", default-features = false, features = ["json", "toml", "yaml"] }
openraft = { version = "0.9.24", features = ["serde", "storage-v2"] }
prost = "0.14.4"
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-prost = "0.14.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"
